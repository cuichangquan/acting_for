services:
  app:
    build:
      context: .
      dockerfile: docker/migration/Dockerfile
    working_dir: /app
    volumes:
      - .:/app
      - gems:/usr/local/bundle
    environment:
      RAILS_ENV: test
      BUNDLE_GEMFILE: /app/gemfiles/rails_8_0.gemfile
      BUNDLE_PATH: /usr/local/bundle
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_DB: acting_for_dummy_test
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: acting_for_dummy_test
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gems:
  postgres_data:
